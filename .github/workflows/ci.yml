name: CI Pipeline & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data & Features Pipeline Test (Phase 1)
        run: |
          python scripts/test_pipeline_phase1_data_features.py

      - name: Run FastAPI Serving & Inference Test
        run: |
          python scripts/test_fastapi.py

  build-and-push:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Docker Hub Credentials
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub credentials detected. Image will be pushed."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Docker Hub credentials not configured. Building image locally to verify Dockerfile without pushing."
          fi

      - name: Log in to Docker Hub (if secrets provided)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image (if secrets provided)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/telco-fastapi:latest

      - name: Build Docker image only (no push)
        if: steps.check-secrets.outputs.has_secrets == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: telco-fastapi:latest
